name: Build separate KVM preview firmware
on:
  workflow_dispatch:
    inputs:
      preview_run:
        required: true
        description: Successful full x86 preview run
      platform_run:
        required: true
        description: Successful matching native platform run
      session_fixture:
        type: boolean
        default: false
        description: Build a separate disposable full-service test, never a serving image
permissions:
  contents: read
  actions: read
jobs:
  firmware-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read the fixed draft firmware inputs without publishing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download retained-native-bootstrap-20261028 --repo EnclaveHost/enclave-os --pattern retained-igvm-inputs.tar --dir inputs
          printf '%s\n' 'dc7220f885bd919208252389487dd139346e3aff9d79cc7d85ec2930b23f9e38  inputs/retained-igvm-inputs.tar' | sha256sum -c -
      - name: Fetch the retained controller for the sealed-secret test only
        if: inputs.session_fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download retained-native-bootstrap-20261028 --repo EnclaveHost/enclave-os --pattern controller.wasm --dir inputs
          printf '%s\n' '104468ceffadc0792d09674ef97bcd30aaa212ee1137cf1f8c0560c99cf82786  inputs/controller.wasm' | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-igvm-inputs
          path: inputs/
          retention-days: 1
  firmware:
    needs: firmware-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retained-igvm-inputs
          path: inputs
      - name: Fetch successful matching preview and startup archive
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
          PLATFORM_RUN: ${{ inputs.platform_run }}
        run: |
          [[ "$PREVIEW_RUN" =~ ^[0-9]+$ && "$PLATFORM_RUN" =~ ^[0-9]+$ ]]
          mkdir records
          gh run view "$PREVIEW_RUN" --repo EnclaveHost/enclave-os --json headSha,conclusion,workflowName >records/preview-run.json
          gh run view "$PLATFORM_RUN" --repo EnclaveHost/enclave-os --json headSha,conclusion,workflowName >records/platform-run.json
          test "$(jq -r .conclusion records/preview-run.json)" = success
          test "$(jq -r .conclusion records/platform-run.json)" = success
          test "$(jq -r .workflowName records/preview-run.json)" = 'Separate x86 full-feature preview root'
          test "$(jq -r .workflowName records/platform-run.json)" = 'Build native platform for verified Alpine preview'
          gh run download "$PREVIEW_RUN" --repo EnclaveHost/enclave-os --name enclave-os-x86-preview --dir preview
          gh run download "$PLATFORM_RUN" --repo EnclaveHost/enclave-os --name enclave-os-kvm-platform --dir platform
          printf '%s\n' 'dc7220f885bd919208252389487dd139346e3aff9d79cc7d85ec2930b23f9e38  inputs/retained-igvm-inputs.tar' | sha256sum -c -
          tar -xf inputs/retained-igvm-inputs.tar -C inputs
      - name: Compile the explicitly separate session test
        if: inputs.session_fixture
        run: |
          mkdir platform-source session
          printf '%s\n' '85f51d772fa9b775f59b8dc14f7a5a3330fe442c773e13dd30ff938b879ac4fb  integrations/native-platform/source.tar.gz' | sha256sum -c -
          tar -xzf integrations/native-platform/source.tar.gz -C platform-source
          docker run --rm --memory=3g --memory-swap=3g --cpus=2 \
            -v "$PWD:/src:ro" -v "$PWD/platform-source:/platform:ro" \
            -v "$PWD/preview:/preview:ro" -v "$PWD/platform:/native:ro" \
            -v "$PWD/inputs:/inputs:ro" -v "$PWD/session:/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh /src/tools/ci-kvm-session.sh
      - name: Reproduce baseline, build twice and check measurement mutations
        env:
          SESSION_FIXTURE: ${{ inputs.session_fixture }}
        run: |
          ulimit -c 0
          if [ "$SESSION_FIXTURE" = true ]; then
            python3 tools/kvm_firmware.py inputs platform preview out --fixture session/fixture
          else
            python3 tools/kvm_firmware.py inputs platform preview out
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enclave-os-kvm-${{ inputs.session_fixture && 'session-fixture' || 'firmware' }}
          path: |
            out
            records
            session/fixture/fixture.json
          retention-days: 7
