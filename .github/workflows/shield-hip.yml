name: Shield CUDA and HIP compatibility on musl
on:
  workflow_dispatch:
    inputs:
      cpu_run_id:
        required: true
        description: Signed patched CPU OpenCL packages
      frontend_run_id:
        required: true
        description: Signed Shield OpenCL frontend packages
      platforms:
        required: true
        default: '["amd64","riscv64"]'
permissions:
  contents: read
  actions: read
jobs:
  hip:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.platform == 'riscv64'
        with:
          platforms: riscv64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Fetch signed dependencies and exact source objects
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_RUN: ${{ inputs.cpu_run_id }}
          FRONTEND_RUN: ${{ inputs.frontend_run_id }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$CPU_RUN" =~ ^[0-9]+$ && "$FRONTEND_RUN" =~ ^[0-9]+$ ]]
          gh run download "$CPU_RUN" --name "opencl-cpu-$PLATFORM" --dir cpu
          gh run download "$FRONTEND_RUN" --name "shield-opencl-$PLATFORM" --dir frontend
          python3 - <<'PYCODE'
          import importlib.util, pathlib, subprocess
          spec=importlib.util.spec_from_file_location('source', 'components/shield-hip/prepare-source.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          for path, revision in module.REVISIONS.items():
              target=pathlib.Path('chipStar-checkout') / path
              target.mkdir(parents=True, exist_ok=True)
              repository='chipStar' if path=='.' else path.split('/')[-1]
              subprocess.run(['git','init','-q',str(target)],check=True)
              subprocess.run(['git','-C',str(target),'fetch','--depth=1',
                  f'https://github.com/CHIP-SPV/{repository}.git',revision],check=True)
          PYCODE
          python3 components/shield-hip/prepare-source.py --checkout chipStar-checkout --output chipStar-source
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf chipStar-source.tar chipStar-source
          rm -rf chipStar-checkout
      - name: Build installed compiler and exercise CPU fallback
        run: |
          mkdir out
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 --platform linux/${{ matrix.platform }} \
            -v "$PWD:/src:ro" -v "$PWD/cpu:/cpu:ro" -v "$PWD/frontend:/frontend:ro" -v "$PWD/out:/out" \
            alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            /bin/sh /src/tools/ci-shield-hip.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shield-hip-${{ matrix.platform }}
          path: out/
          retention-days: 7
