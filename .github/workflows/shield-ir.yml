name: Installed audited Shield IR reference
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch qualified compiler and runtime packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40617020912 --name opencl-cpu-amd64 --dir cpu
          gh run download 40617930209 --name shield-opencl-amd64 --dir frontend
          gh run download 40619200767 --name shield-hip-amd64 --dir hip
      - name: Install the reference and exercise actual wrapper and rejection cases
        run: |
          mkdir out
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 \
            -v "$PWD:/src:ro" -v "$PWD/cpu:/cpu:ro" -v "$PWD/frontend:/frontend:ro" \
            -v "$PWD/hip:/hip:ro" -v "$PWD/out:/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh /src/tools/ci-shield-ir.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shield-ir-amd64
          path: out/
          retention-days: 7
