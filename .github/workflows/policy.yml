name: Native ABI security policy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, riscv64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.platform == 'riscv64'
        with:
          platforms: riscv64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Build native policy test and disposable kernel payload
        run: |
          mkdir -p out
          docker run --rm --memory=6g --memory-swap=6g --cpus=2 --platform linux/${{ matrix.platform }} \
            -e ENCLAVE_ARCH=${{ matrix.platform == 'amd64' && 'x86_64' || 'riscv64' }} -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            /bin/sh /src/tools/ci-policy-build.sh
      - name: Exercise the policy in a real target kernel
        run: |
          docker run --rm --memory=1g --memory-swap=1g --cpus=2 --platform linux/amd64 -w /src \
            -e ENCLAVE_ARCH=${{ matrix.platform == 'amd64' && 'x86_64' || 'riscv64' }} -e ENCLAVE_POLICY_TEST=1 \
            -v "$PWD:/src:ro" -v "$PWD/out:/src/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh /src/tools/ci-boot.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-policy-${{ matrix.platform }}
          path: |
            out/boot.log
            out/root/policy-test
            out/smoke-kernel
            out/smoke-initramfs.cpio.gz
          retention-days: 7
