name: Sunshine portable package
on:
  workflow_dispatch:
    inputs:
      platforms:
        default: '["amd64","riscv64"]'
        required: true
permissions:
  contents: read
jobs:
  sunshine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.platform == 'riscv64'
        with:
          platforms: riscv64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LizardByte/Sunshine
          ref: 63d35f702ee9e362e43263742981836ec0710384
          submodules: recursive
          path: upstream
      - name: Build the shared web interface on the build CPU
        run: |
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 --platform linux/amd64 \
            -v "$PWD/upstream:/source" -w /source \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh -ec 'apk add --no-cache nodejs npm; npm ci --ignore-scripts; mkdir prebuilt; SUNSHINE_ASSETS_DIR=/source/prebuilt npm run build; rm -rf node_modules'
      - name: Archive pinned source and submodule provenance
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,subprocess,hashlib
          root=pathlib.Path('upstream')
          commit=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          assert commit == '63d35f702ee9e362e43263742981836ec0710384'
          modules=subprocess.check_output(['git','-C',str(root),'submodule','status','--recursive'],text=True)
          assert all(line.startswith(' ') for line in modules.splitlines())
          (root/'enclave-source.json').write_text(json.dumps({'repository':'LizardByte/Sunshine','commit':commit,'submodules':modules,'webAssetsSha256':{str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((root/'prebuilt').rglob('*')) if p.is_file()}},indent=2)+'\n')
          PYCODE
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --exclude=.git --transform='s,^upstream,sunshine,' -cf enclave-sunshine-source.tar upstream
      - name: Build and install the CPU streaming server
        run: |
          mkdir -p out
          docker run --rm --memory=6g --memory-swap=6g --cpus=2 --platform linux/${{ matrix.platform }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            /bin/sh /src/tools/ci-sunshine.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sunshine-${{ matrix.platform }}
          path: out/
          retention-days: 7
