name: Shield transport on musl
on:
  push:
    paths:
      - components/shield-graphics/**
      - tools/ci-shield-transport.sh
      - .github/workflows/shield.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, riscv64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.platform == 'riscv64'
        with:
          platforms: riscv64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Build and test the protected graphics client with UBSan
        run: |
          mkdir -p out
          docker run --rm --memory=2g --memory-swap=2g --cpus=2 --platform linux/${{ matrix.platform }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            /bin/sh /src/tools/ci-shield-transport.sh > out/transport.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shield-transport-${{ matrix.platform }}
          path: out/transport.log
          retention-days: 7
