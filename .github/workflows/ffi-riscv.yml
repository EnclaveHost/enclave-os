name: RISC-V static libffi under actual kernel policy
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ffi-riscv64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: riscv64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Fetch the previously qualified RISC-V policy kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out retained
          test "$(gh run view 40615018707 --json conclusion --jq .conclusion)" = success
          gh run download 40615018707 --name native-policy-riscv64 --dir kernel
          printf '%s\n' '37210b41685e98ac99378e4bd82b164b8d6796e2a3a4d4527cb55a43650764d5  kernel/smoke-kernel' | sha256sum -c -
          cp kernel/smoke-kernel out/
      - name: Build upstream trampoline backport and signed package
        run: |
          docker run --rm --memory=3g --memory-swap=3g --cpus=2 --platform linux/riscv64 \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" -v "$PWD/retained:/retained:ro" \
            alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            /bin/sh /src/tools/ci-ffi.sh
      - name: Exercise callbacks and RWX refusal under the target kernel
        run: |
          docker run --rm --memory=1g --memory-swap=1g --cpus=2 -w /src \
            -e ENCLAVE_ARCH=riscv64 -v "$PWD:/src:ro" -v "$PWD/out:/src/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh /src/tools/ci-boot.sh
          grep -q ENCLAVE_FFI_POLICY_OK out/boot.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enclave-libffi-riscv64
          path: |
            out/repository/
            out/*.pub
            out/*.json
            out/*.log
          retention-days: 7
