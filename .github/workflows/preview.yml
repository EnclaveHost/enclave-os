name: Separate x86 full-feature preview root
on:
  workflow_dispatch:
    inputs:
      browser_run_id:
        description: Successful custom musl browser build and qualification
        required: true
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned, qualified x86 package inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RUN: ${{ inputs.browser_run_id }}
        run: |
          [[ "$BROWSER_RUN" =~ ^[0-9]+$ ]]
          python3 tools/fetch-preview.py --browser-run "$BROWSER_RUN" --output inputs
      - name: Assemble signed packages and measure the separate candidate
        run: |
          mkdir out
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 \
            -v "$PWD:/src:ro" -v "$PWD/inputs:/inputs:ro" -v "$PWD/out:/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh /src/tools/ci-preview.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enclave-os-x86-preview
          path: |
            out/*.json
            out/*.apk-installed
            out/*.log
            out/*.squashfs
            out/*.verity
            out/SHA256SUMS
          retention-days: 7
          compression-level: 0
