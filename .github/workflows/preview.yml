name: Separate x86 full-feature preview root
on:
  workflow_call:
    inputs:
      browser_run_id:
        type: string
        required: true
      source_ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      browser_run_id:
        description: Successful custom musl browser build and qualification
        required: true
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EnclaveHost/enclave-os
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Fetch pinned, qualified x86 package inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RUN: ${{ inputs.browser_run_id }}
        run: |
          [[ "$BROWSER_RUN" =~ ^[0-9]+$ ]]
          python3 tools/fetch-preview.py --browser-run "$BROWSER_RUN" --output inputs
      - name: Assemble signed packages and measure the separate candidate
        run: |
          mkdir out
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 \
            --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/src:ro" -v "$PWD/inputs:/inputs:ro" -v "$PWD/out:/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh /src/tools/ci-preview.sh
      - name: Build a small boot fixture for the measured candidate
        run: |
          docker run --rm --memory=2g --memory-swap=2g --cpus=2 \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh /src/tools/ci-preview-boot-build.sh
      - name: Boot the read-only root under the pinned KVM kernel
        run: |
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d \
            /bin/sh -ec 'apk add --no-cache python3 qemu-system-x86_64; python3 /src/tests/preview-boot.py'
      - name: Wrap verified root and hash payloads for native optical attachment
        run: python3 tools/kvm_media.py out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enclave-os-x86-preview
          path: |
            out/*.json
            out/*.apk-installed
            out/*.log
            out/*.iso
            out/SHA256SUMS
            out/kvm-boot/
          retention-days: 7
          compression-level: 0
