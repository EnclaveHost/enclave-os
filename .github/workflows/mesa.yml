name: Shield Mesa Alpine package
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON architecture list to build
        default: '["amd64","riscv64"]'
        required: true
permissions:
  contents: read
jobs:
  mesa:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.platform == 'riscv64'
        with:
          platforms: riscv64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Build, install and inspect masked Mesa APIs
        run: |
          mkdir -p out
          docker run --rm --memory=6g --memory-swap=6g --cpus=2 --platform linux/${{ matrix.platform }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            /bin/sh /src/tools/ci-mesa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shield-mesa-${{ matrix.platform }}
          path: out/
          retention-days: 7
