Section "Device"
    Identifier "enclave-display"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
    Identifier "enclave-screen"
    Device "enclave-display"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "960x600"
    EndSubSection
EndSection
# The RISC Box simplefb device tree must advertise 960x600 (see reference).
