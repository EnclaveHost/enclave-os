# Simple framebuffer and the RISC Box's virtual input device. No GPU autodetection.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Module"
    Load "fbdevhw"
    Load "shadow"
EndSection
Section "Device"
    Identifier "enclave-display"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "InputDevice"
    Identifier "enclave-hid"
    Driver "libinput"
    Option "Device" "/dev/input/event0"
EndSection
Section "Screen"
    Identifier "enclave-screen"
    Device "enclave-display"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "960x600"
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "enclave-layout"
    Screen "enclave-screen"
    InputDevice "enclave-hid" "CorePointer"
    InputDevice "enclave-hid" "CoreKeyboard"
EndSection
# The boot adapter must advertise 960x600 simplefb and authorize only this virtual HID.
