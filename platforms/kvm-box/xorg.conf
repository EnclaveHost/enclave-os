Section "Device"
    Identifier "enclave-display"
    Driver "dummy"
    VideoRam 16384
EndSection
Section "Monitor"
    Identifier "enclave-monitor"
    HorizSync 20-100
    VertRefresh 20-100
    Modeline "960x600" 44.00 960 1000 1096 1232 600 603 609 624
EndSection
Section "Screen"
    Identifier "enclave-screen"
    Device "enclave-display"
    Monitor "enclave-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "960x600"
    EndSubSection
EndSection
